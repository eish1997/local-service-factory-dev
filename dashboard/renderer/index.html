<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地图片看板</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="compact-overrides.css">
  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="actions.css">
</head>
<body>
  <div class="titlebar" title="精简模式下双击恢复">
    <div class="title-status">
      <i></i>
      <strong id="title-state">空闲</strong>
      <span id="title-progress">0 / 0</span>
      <span id="title-images">本地 0</span>
    </div>
    <div class="window-actions">
      <button id="update-settings" title="版本与更新" aria-label="版本与更新"></button>
      <button id="key-settings" title="渠道与密钥" aria-label="渠道与密钥"></button>
      <button id="open-folder" title="设置资产路径">□</button>
      <button id="compact-toggle" title="精简模式">↙</button>
      <button id="window-minimize" title="最小化">−</button>
      <button id="window-maximize" title="最大化">□</button>
      <button id="window-close" title="关闭">×</button>
    </div>
  </div>
  <main>
    <section id="job-monitor" class="job-monitor monitor-idle" aria-label="全局任务状态"></section>
    <div id="gallery-panel">
    <aside class="project-column"><header>项目</header><div id="project-tabs" class="project-tabs"></div></aside>
    <aside class="batch-column"><header><nav class="page-tabs"><button id="gallery-page" class="selected">批次</button><button id="variables-page">提示词</button></nav><button id="task-new" class="icon-button" title="新建批次" aria-label="新建批次">＋</button></header><div id="task-batch-list"></div><aside id="variable-types" hidden></aside><select id="task-batch" hidden aria-label="当前批次"></select></aside>
    <section class="content-column">
      <div class="content-toolbar">
        <div id="task-actions" hidden>
          <button id="task-select-all" title="全选当前批次" aria-label="全选当前批次">☑</button><button id="task-clear" title="取消选择" aria-label="取消选择">☐</button><span id="task-selection">未选择组</span>
          <button id="task-plan" title="查看执行范围与预算" aria-label="查看执行范围与预算">ⓘ</button><button id="task-start" title="执行选中组" aria-label="执行选中组" disabled>▶</button>
          <span class="toolbar-divider"></span><select id="task-target" aria-label="要操作的任务"><option value="">暂无任务</option></select>
          <button id="task-package" title="打包所选组" aria-label="打包所选组" disabled></button><button id="task-pause" title="暂停调度，已发出的请求继续收尾" aria-label="暂停调度" disabled>Ⅱ</button><button id="task-resume" title="继续原任务" aria-label="继续原任务" disabled>▷</button><button id="task-retry" title="仅重试允许恢复的失败项" aria-label="重试失败项" disabled>↻</button>
          <select id="task-filter" aria-label="按组状态筛选"><option value="">全部状态</option><option value="pending">待生成</option><option value="active">生成中</option><option value="failed">失败 / 暂停</option><option value="review">待审核</option><option value="completed">已完成</option></select>
        </div>
        <button id="task-refresh" title="刷新" aria-label="刷新">⟳</button>
      </div>
      <div class="content-scroll">
        <span id="group-summary"></span>
        <section id="task-library"><p id="task-message" role="status">选择项目与批次，或点击批次栏的 ＋ 创建新批次。</p><div id="task-plan-info" hidden></div><div id="task-jobs"></div><div id="task-cards"></div></section>
        <div id="key-pool" class="key-pool"></div><div id="gallery" class="group-gallery"></div>
      </div>
    <section id="variables-panel" hidden>
      <div class="variable-toolbar">
        <select id="variable-project" hidden aria-label="当前项目"></select>
        <input id="variable-search" aria-label="搜索变量或候选内容" placeholder="搜索变量或候选内容">
        <select id="variable-role" aria-label="适用图片类型"><option value="">全部图片类型</option><option value="cover">封面</option><option value="detail">详情</option></select>
        <select id="variable-filter" aria-label="生效状态"><option value="">全部状态</option><option value="active">当前生效</option><option value="legacy">旧批次使用</option><option value="disabled">已停用候选</option></select>
        <button id="variable-reload" title="刷新变量" aria-label="刷新变量">⟳</button>
      </div>
      <p class="variable-guidance">如需修改变量，请在 Agent 对话中提出。</p>
      <p id="variable-status" role="status">加载变量目录…</p>
      <article id="variable-content"></article>
    </section>
    </section>
    </div>
    <dialog id="task-create-dialog" aria-labelledby="task-create-title">
      <form id="task-create-form"><header><h2 id="task-create-title">新建批次</h2><button type="button" id="task-create-close" title="关闭" aria-label="关闭">×</button></header>
        <p>按当前项目的完整组结构组装提示词，不会自动生图。</p>
        <label>组数 <input id="task-count" type="number" min="1" max="100" required value="10"></label>
        <label>手机号 <input id="task-phone" type="tel" inputmode="numeric" maxlength="11" pattern="1[3-9][0-9]{9}" required autocomplete="off" placeholder="必填，本批次手机号"></label>
        <p id="task-create-error" role="alert"></p><footer><button type="button" id="task-create-cancel">取消</button><button id="task-assemble" type="submit">创建批次</button></footer>
      </form>
    </dialog>

  </main>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="variables.js"></script>
  <script src="tasks.js"></script>
  <script src="actions.js"></script>
</body>
</html>
